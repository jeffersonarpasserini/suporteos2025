#habilitando o banco de dados h2
spring.h2.console.enabled=true
#path para acesso
spring.h2.console.path=/h2-console

#configuracao acesso ao banco --> jdbc:h2:file:~/cursodb
spring.datasource.url=jdbc:h2:mem:cursodb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# application.properties
logging.file.name=suporteos_test.log
logging.level.root=INFO
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type=TRACE

#exibe os SQL gerado no console
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Chave exclusiva do ambiente de testes. Nunca use esta chave em producao.
app.jwt.secret=chave-exclusiva-para-testes-1234567890
app.jwt.expiration=15m
app.jwt.issuer=suporteos2025-test
